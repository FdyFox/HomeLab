---

- name: Create dirs
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ default_user }}'
    group: '{{ default_user }}'
    mode: '0755'
  become: true
  loop:
    - '{{ docker_container_data_folder }}/freshrss'
    - '/home/{{ default_user }}/docker/freshrss/'

- name: Create compose file
  ansible.builtin.template:
    src: freshrss_stack.yml.j2
    dest: '/home/{{ default_user }}/docker/freshrss/compose.yaml'
    owner: '{{ default_user }}'
    group: '{{ default_user }}'
    mode: '0644'

- name: Run `docker compose up`
  community.docker.docker_compose_v2:
    project_src: '/home/{{ default_user }}/docker/freshrss/'
    pull: always
