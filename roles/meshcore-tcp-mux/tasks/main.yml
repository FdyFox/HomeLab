---

- name: Create dirs
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.user | default(default_user) }}'
    group: '{{ item.group | default(default_user) }}'
    mode: '{{ item.mode | default("0755") }}'
    recurse: true
  loop:
    - path: '{{ docker_container_data_folder }}/meshcore-mux/data'
    - path: '{{ docker_container_config_folder }}/meshcore-mux'
    - path: '/home/{{ default_user }}/docker/meshcore-mux/'
  become: true

- name: Create compose file
  ansible.builtin.template:
    src: meshcore-mux_stack.yml.j2
    dest: '/home/{{ default_user }}/docker/meshcore-mux/compose.yaml'
    owner: '{{ default_user }}'
    group: '{{ default_user }}'
    mode: '0755'

- name: Create config file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: '{{ docker_container_config_folder }}/meshcore-mux/config.yaml'
    owner: '{{ default_user }}'
    group: '{{ default_user }}'
    mode: '0755'

- name: Run `docker compose up`
  community.docker.docker_compose_v2:
    project_src: '/home/{{ default_user }}/docker/meshcore-mux/'
