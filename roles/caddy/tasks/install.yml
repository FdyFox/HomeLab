---
- name: Populate service facts
  ansible.builtin.service_facts:

- name: Stop service
  ansible.builtin.service:
    name: caddy
    enabled: true
    state: stopped
  when: ansible_facts['services']['caddy.service']['status'] | default('not-found') != 'not-found'
  become: true

- name: Install xCaddy
  become: true
  block:
    - name: Ensure dependencies are installed.
      ansible.builtin.apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - gnupg2
          - curl
        state: present

    - name: Install golang if missing
      ansible.builtin.include_tasks: golang.yml

    # The cloudsmith apt repo is no longer usable (402 Payment Required)
    - name: Remove old xcaddy apt repository
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/caddy-xcaddy.list
        - /usr/share/keyrings/caddy-xcaddy-archive-keyring.gpg

    - name: Remove old xcaddy package
      ansible.builtin.apt:
        name: xcaddy
        state: absent

    - name: Install xCaddy
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          export PATH=$PATH:/usr/local/go/bin
          GOBIN=/usr/local/bin go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
        creates: /usr/local/bin/xcaddy

    - name: Check for existing version
      ansible.builtin.stat:
        path: '{{ caddy_bin_path }}'
      register: existing_caddy

    - name: Remove existing version
      when: existing_caddy.stat.exists
      block:
        - name: Create backup
          ansible.builtin.copy:
            src: '{{ caddy_bin_path }}'
            dest: '/home/{{ default_user }}/caddy_backup'
            force: true
            mode: '0777'
            remote_src: true

        - name: Remove existing version
          ansible.builtin.file:
            path: '{{ caddy_bin_path }}'
            state: absent

    - name: Build custom caddy binary
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          export PATH=$PATH:/usr/local/go/bin
          xcaddy build --with github.com/mholt/caddy-l4 --with github.com/caddy-dns/cloudflare --with github.com/caddy-dns/all-inkl --output {{ caddy_bin_path }}
        creates: '{{ caddy_bin_path }}'

    - name: Make caddy executable
      ansible.builtin.file:
        path: '{{ caddy_bin_path }}'
        mode: '0755'

    - name: Create Caddy systemd unit file
      ansible.builtin.template:
        src: caddy.service.j2
        dest: /etc/systemd/system/caddy.service
        mode: "0644"

    - name: Add caddy group
      ansible.builtin.group:
        name: "{{ caddy_group_name }}"
        system: true

    - name: Add caddy user
      ansible.builtin.user:
        name: "{{ caddy_user_name }}"
        group: "{{ caddy_group_name }}"
        home: "{{ caddy_user_home_dir }}"
        create_home: true
        shell: "/usr/sbin/nologin"
        system: true

    - name: Create config directorys
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ caddy_user_name }}"
        group: '{{ caddy_group_name }}'
      loop:
        - "{{ caddy_config_path }}"
        - "{{ caddy_config_path }}/vhosts"
        - "{{ caddy_config_path }}/snippets"
        - "{{ caddy_log_path }}"

    - name: Add Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ caddy_config_path }}/Caddyfile"
        mode: "0644"
        owner: "{{ caddy_user_name }}"
        group: '{{ caddy_group_name }}'
        lstrip_blocks: true
      notify: Reload caddy

    - name: Create config snippets
      ansible.builtin.template:
        mode: "0644"
        src: 'snippets/{{ item }}.j2'
        dest: "{{ caddy_config_path }}/snippets/{{ item }}"
        owner: "{{ caddy_user_name }}"
        group: '{{ caddy_group_name }}'
      loop:
        - tls.conf
        - protected.conf
        - layer4.conf
      notify: Reload caddy

    - name: Create dummy .env file
      ansible.builtin.file:
        path: '{{ caddy_config_path }}/.env'
        state: touch
        owner: '{{ caddy_user_name }}'
        group: '{{ caddy_group_name }}'
        mode: '0640'

    - name: Enable and start Caddy service
      ansible.builtin.systemd_service:
        name: caddy
        enabled: true
        daemon_reload: true
        state: started
