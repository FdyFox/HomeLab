---

# Baisc host settings
host_name: docker02
host_ip: 192.168.1.30
host_gateway: 192.168.1.1
host_subnet: /24
host_vlan: 1

# LXC settings
lxc_data:
  vmid: 112
  node: "evoli"
  cores: 2
  memory: 4096
  disk: 'zfs:80'
  netif:
    net0: "name=eth0,gw={{ host_gateway }},ip={{ host_ip }}{{ host_subnet }},bridge=vmbr0,firewall=0,tag={{ host_vlan }}"

# Reverse Proxy settings
proxy:
  - name: bazarr
    hostname: 'bazarr.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:6767'
    protected_enabled: false
    dashboard:
      group: Servarr
      title: Bazarr
      icon: 'di:bazarr'

  - name: gluten
    hostname: 'gluten.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:8000'

  - name: jellyseerr
    hostname: 'jellyseerr.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:5055'
    dashboard:
      group: Applications
      title: Jellyseerr
      icon: 'di:jellyseerr'

  - name: komodo
    hostname: 'komo.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:9120'
    dashboard:
      group: Infrastructure
      title: Komodo
      icon: 'di:komodo'

  - name: lidarr
    hostname: 'lidarr.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:8686'
    dashboard:
      group: Servarr
      title: Lidarr
      icon: 'di:lidarr'

  - name: nzb
    hostname: 'nzb.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:6789'
    dashboard:
      group: Downloader
      title: NZBGet
      icon: 'di:nzbget'
      alt_status_codes: [401, 403]

  - name: prowlarr
    hostname: 'prowlarr.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:9696'
    dashboard:
      group: Downloader
      title: Prowlarr
      icon: 'di:prowlarr'

  - name: qbit
    hostname: 'qbit.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:8080'
    dashboard:
      group: Downloader
      title: qBittorrent
      icon: 'di:qbittorrent'

  - name: radarr
    hostname: 'radarr.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:7878'
    dashboard:
      group: Servarr
      title: Radarr
      icon: 'di:radarr'

  - name: sonarr
    hostname: 'sonarr.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:8989'
    dashboard:
      group: Servarr
      title: Sonarr
      icon: 'di:sonarr'

  - name: terminal
    hostname: 'terminal.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:3000'
    authentik_enabled: true

  - name: drk
    hostname: 'drk.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:6000'
    protected_enabled: false

  - name: lose
    hostname: 'lose.berger-em.net'
    proxy_host: 'http://{{ host_ip }}:6050'
    dashboard:
      group: Applications
      title: Rubbellose
      icon: 'sh:tradetally'

# Services deployed on this host
docker_roles:
  - name: arr_stack
  - name: minecraft
  - name: komodo
